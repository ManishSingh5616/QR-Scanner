name: qr_scanner_pro
description: QR Scanner Pro
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.2.1
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  google_mlkit_barcode_scanning: ^0.10.0
  ambient_light: ^0.1.0
  permission_handler: ^11.3.0
  share_plus: ^7.2.1
  path_provider: ^2.1.2
  screenshot: ^3.0.0
  gallery_saver_plus: ^3.0.1
  google_mobile_ads: ^8.0.0
  # Firebase Core and Auth
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_analytics: ^11.4.3
  firebase_crashlytics: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # App icon generator
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/